<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <script>
      // Apply the theme before the first paint (same rule as src/lib/theme.ts), so dark mode never flashes white.
      try {
        var t = localStorage.getItem('theme')
        if (t !== 'light' && t !== 'dark') t = document.documentElement.dataset.theme
        if (t !== 'light' && t !== 'dark') t = matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light'
        document.documentElement.classList.toggle('dark', t === 'dark')
        document.documentElement.style.colorScheme = t
      } catch (e) {}
    </script>
    <title>PROTOTYPE · PR review companion</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
